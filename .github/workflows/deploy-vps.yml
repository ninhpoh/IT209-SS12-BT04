
  name: Build and Deploy Spring Boot

  on:
    push:
      branches:
        - main
    workflow_dispatch:

  permissions:
    contents: read
    packages: write

  jobs:
    build-image:
      name: Build and Push Docker Image
      runs-on: ubuntu-latest

      steps:
        - name: Checkout source code
          uses: actions/checkout@v4

        - name: Login to GitHub Container Registry
          uses: docker/login-action@v3
          with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}

        - name: Build and Push Image
          uses: docker/build-push-action@v6
          with:
            context: .
            push: true
            tags: ghcr.io/${{ github.repository_owner }}/bt04:latest

    deploy-vps:
      name: Deploy to VPS via SSH
      runs-on: ubuntu-latest
      needs: build-image

      steps:
        - name: Deploy application on VPS
          uses: appleboy/ssh-action@v1.0.3
          env:
            GHCR_USERNAME: ${{ github.repository_owner }}
            GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          with:
            host: ${{ secrets.SSH_HOST }}
            username: ${{ secrets.SSH_USER }}
            key: ${{ secrets.SSH_KEY }}
            envs: GHCR_USERNAME,GHCR_TOKEN
            script: |
              set -e
              
              echo "$GHCR_TOKEN" | docker login ghcr.io \
                -u "$GHCR_USERNAME" --password-stdin
              
              docker pull ghcr.io/${{ github.repository_owner }}/bt04:latest
              
              docker stop bt04 || true
              docker rm bt04 || true
              
              docker run -d \
                --name bt04 \
                --restart unless-stopped \
                -p 8080:8080 \
                ghcr.io/${{ github.repository_owner }}/bt04:latest
              
              docker ps --filter "name=bt04"
              docker logout ghcr.io
